spring.application.name=backend

# H2 Database Configuration (Default / Fallback)
spring.datasource.url=jdbc:h2:mem:upi_simulator;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Configuration (Uncomment to use MySQL database)
# spring.datasource.url=jdbc:mysql://localhost:3306/upi_simulator?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=upi_user
# spring.datasource.password=upi_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret and Expiration (24 hours)
upi.app.jwtSecret=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
upi.app.jwtExpirationMs=86400000

# Server Port
server.port=8080
